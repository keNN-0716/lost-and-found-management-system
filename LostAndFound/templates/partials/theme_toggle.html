<button type="button" class="theme-toggle" data-theme-toggle role="switch" aria-checked="true" aria-label="Dark theme" title="Switch theme">
  <span class="theme-toggle__icon theme-toggle__icon--sun"><svg class="i"><use href="#i-sun"/></svg></span>
  <span class="theme-toggle__icon theme-toggle__icon--moon"><svg class="i"><use href="#i-moon"/></svg></span>
  <span class="theme-toggle__thumb" aria-hidden="true"></span>
</button>
