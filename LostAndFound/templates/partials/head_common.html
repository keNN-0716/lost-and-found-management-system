{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#030d2e">
{# Resolve the theme before first paint so there is no flash of the wrong one. #}
<script>
  (function () {
    var root = document.documentElement, theme = 'dark';
    try {
      var saved = localStorage.getItem('cspc-theme');
      if (saved === 'light' || saved === 'dark') theme = saved;
      else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
    } catch (e) {}
    root.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#e8eefb' : '#030d2e');
  })();
</script>
<link rel="icon" href="{% static 'img/cspc_logo.png' %}">
<link rel="preload" href="{% static 'fonts/sora-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{% static 'fonts/instrument-sans-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
